name: Test server-core on Linux

on:
  workflow_dispatch:
  push:
    paths:
      - 'server-core/**'
      - 'protos/**'
      - '.github/workflows/test-server-core.yml'
  pull_request:
    paths:
      - 'server-core/**'
      - 'protos/**'
      - '.github/workflows/test-server-core.yml'

jobs:
  test_server_core:
    name: Build and run server-core tests
    strategy:
      matrix:
        os: [ubuntu-22.04]
        include:
          - os: ubuntu-22.04
            vcpkg_triplet: x64-linux
            cmake_preset: linux-Debug
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server-core
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Deps
        run: sudo apt update && sudo apt install libpipewire-0.3-dev

      - uses: lukka/get-cmake@latest

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 10b7a178346f3f0abef60cecd5130e295afd8da4

      - run: vcpkg integrate install

      - run: vcpkg install asio protobuf cxxopts

      - run: vcpkg install spdlog

      - uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/server-core/CMakeLists.txt
          configurePreset: ${{ matrix.cmake_preset }}
          buildPreset: ${{ matrix.cmake_preset }}

      - name: Run tests
        run: ctest --test-dir out/build/${{ matrix.cmake_preset }} --output-on-failure
